<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dede · 个人主页</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ---------- 重置 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background: radial-gradient(circle at 30% 30%, #1a1a2e, #0f0c29);
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 20px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* ---------- 粒子画布 ---------- */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ---------- 卡片 ---------- */
        .card {
            position: relative;
            z-index: 1;
            width: 420px;
            max-width: 95%;
            min-height: 420px;
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 40px 30px;
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            transition: width 0.6s cubic-bezier(0.25, 0.8, 0.25, 1),
                        padding 0.6s cubic-bezier(0.25, 0.8, 0.25, 1),
                        min-height 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
            will-change: width, padding, min-height;
            overflow: visible;
        }

        /* ---------- 主视觉 ---------- */
        .main-title {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(1);
            font-size: 72px;
            font-weight: 900;
            letter-spacing: 4px;
            z-index: 2;
            user-select: none;
            transition: left 0.7s cubic-bezier(0.25, 0.8, 0.25, 1),
                        top 0.7s cubic-bezier(0.25, 0.8, 0.25, 1),
                        transform 0.7s cubic-bezier(0.25, 0.8, 0.25, 1),
                        font-size 0.7s cubic-bezier(0.25, 0.8, 0.25, 1);
            will-change: left, top, transform, font-size;
            animation: float 3s ease-in-out infinite, rainbow 4s linear infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) translateY(0); }
            50% { transform: translate(-50%, -50%) translateY(-10px); }
        }

        @keyframes rainbow {
            0% {
                color: #ff0000;
                text-shadow: 0 0 20px rgba(255, 0, 0, 0.7), 0 0 60px rgba(255, 0, 0, 0.5);
            }
            17% {
                color: #ff8800;
                text-shadow: 0 0 20px rgba(255, 136, 0, 0.7), 0 0 60px rgba(255, 136, 0, 0.5);
            }
            33% {
                color: #ffff00;
                text-shadow: 0 0 20px rgba(255, 255, 0, 0.7), 0 0 60px rgba(255, 255, 0, 0.5);
            }
            50% {
                color: #00ff00;
                text-shadow: 0 0 20px rgba(0, 255, 0, 0.7), 0 0 60px rgba(0, 255, 0, 0.5);
            }
            67% {
                color: #0088ff;
                text-shadow: 0 0 20px rgba(0, 136, 255, 0.7), 0 0 60px rgba(0, 136, 255, 0.5);
            }
            83% {
                color: #8800ff;
                text-shadow: 0 0 20px rgba(136, 0, 255, 0.7), 0 0 60px rgba(136, 0, 255, 0.5);
            }
            100% {
                color: #ff0000;
                text-shadow: 0 0 20px rgba(255, 0, 0, 0.7), 0 0 60px rgba(255, 0, 0, 0.5);
            }
        }

        /* ---------- 按钮 ---------- */
        .toggle-btn {
            position: relative;
            z-index: 3;
            margin-top: 220px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            border: none;
            color: #fff;
            padding: 12px 36px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.3);
            transition: transform 0.2s, box-shadow 0.2s, margin-top 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
            will-change: margin-top, transform;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .toggle-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(245, 87, 108, 0.5);
        }

        .toggle-btn i {
            font-size: 18px;
        }

        /* ---------- 内容区域 ---------- */
        .content {
            width: 100%;
            opacity: 0;
            transform: scaleY(0.8) translateY(-20px);
            transform-origin: top center;
            transition: opacity 0.6s ease, transform 0.7s cubic-bezier(0.25, 0.8, 0.25, 1);
            max-height: 0;
            overflow: hidden;
            text-align: left;
            border-top: 1px solid transparent;
            will-change: opacity, transform;
            position: relative;
            z-index: 1;
        }

        .content .name {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
            text-align: center;
        }

        .content .subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 18px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .content .subtitle i { color: #f093fb; }

        .link-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 16px 0;
        }
        .link-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            transition: background 0.3s;
            cursor: pointer;
        }
        .link-item:hover { background: rgba(255, 255, 255, 0.14); }
        .link-item i {
            font-size: 18px;
            width: 20px;
            text-align: center;
            color: #f093fb;
        }

        /* ---------- QA ---------- */
        .qa-static {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .qa-static .section-title {
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .qa-static .section-title i { color: #f093fb; }
        .qa-static .qa-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 12px;
            border-left: 3px solid #f093fb;
            transition: background 0.2s;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .qa-static .qa-item:hover { background: rgba(255, 255, 255, 0.09); }
        .qa-static .qa-question {
            font-weight: 600;
            font-size: 15px;
            color: rgba(255, 255, 255, 0.92);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .qa-static .qa-question i {
            color: #f093fb;
            font-size: 16px;
            width: 18px;
        }
        .qa-static .qa-answer {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.5;
            padding-left: 26px;
        }

        /* ---------- 底部 ---------- */
        .footer {
            margin-top: 24px;
            text-align: center;
            color: rgba(255, 255, 255, 0.2);
            font-size: 13px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .footer .copyright { color: rgba(255, 255, 255, 0.2); }
        .footer .beian a {
            color: rgba(255, 255, 255, 0.2);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s;
        }
        .footer .beian a:hover {
            color: rgba(255, 255, 255, 0.5);
        }

        /* 彩蛋样式 - 容器保留，内容由 JS 动态生成 */
        .footer .easter-egg {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.12);
            letter-spacing: 2px;
            cursor: pointer;
            user-select: none;
            font-weight: 300;
            line-height: 1.6;
            max-width: 320px;
            margin: 0 auto;
            padding: 8px 12px;
            border-radius: 12px;
            background: transparent;
            transition: background 0.3s ease, color 0.3s ease, text-shadow 0.3s ease;
        }
        .footer .easter-egg:hover {
            color: rgba(255, 255, 255, 0.4);
            text-shadow: 0 0 20px rgba(245, 87, 108, 0.15);
            background: rgba(255, 255, 255, 0.04);
        }
        .footer .easter-egg .highlight-43 {
            color: rgba(255, 200, 100, 0.25);
            font-weight: 600;
            transition: color 0.4s ease;
        }
        .footer .easter-egg:hover .highlight-43 {
            color: rgba(255, 200, 100, 0.6);
            text-shadow: 0 0 30px rgba(255, 200, 100, 0.2);
        }

        /* ---------- 展开状态 ---------- */
        .card.expanded {
            width: 90%;
            max-width: 800px;
            min-height: auto;
            padding: 30px 30px 40px;
            align-items: flex-start;
            justify-content: flex-start;
            text-align: left;
        }
        .card.expanded .main-title {
            left: 30px;
            top: 30px;
            transform: translate(0, 0) scale(0.5);
            font-size: 72px;
            animation: none;
            color: #fff;
            text-shadow: 0 0 15px rgba(245, 87, 108, 0.5), 0 0 30px rgba(240, 147, 251, 0.3);
        }
        .card.expanded .toggle-btn {
            margin-top: 0;
            margin-left: auto;
            margin-right: 0;
        }
        .card.expanded .content {
            opacity: 1;
            transform: scaleY(1) translateY(0);
            max-height: 3000px;
            border-top-color: rgba(255, 255, 255, 0.08);
            padding-top: 20px;
            margin-top: 10px;
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 600px) {
            .card {
                width: 95%;
                min-height: 350px;
                padding: 30px 20px;
            }
            .main-title { font-size: 52px; letter-spacing: 2px; }
            .toggle-btn { margin-top: 180px; font-size: 14px; padding: 10px 28px; }
            .card.expanded .main-title {
                left: 20px; top: 20px;
                transform: translate(0, 0) scale(0.5);
                font-size: 52px;
            }
            .card.expanded .toggle-btn { margin-top: 0; }
            .link-grid { grid-template-columns: 1fr; }
            .content .name { font-size: 24px; }
            .qa-static .qa-answer { padding-left: 0; }
            .footer .easter-egg { font-size: 12px; max-width: 260px; }
        }
        @media (max-width: 400px) {
            .footer .easter-egg { font-size: 11px; max-width: 200px; }
        }

        /* ---------- 彩蛋模式 ---------- */
        .forty-three-mode .main-title,
        .forty-three-mode .name,
        .forty-three-mode .subtitle,
        .forty-three-mode .qa-question,
        .forty-three-mode .qa-answer,
        .forty-three-mode .link-item,
        .forty-three-mode .toggle-btn,
        .forty-three-mode .copyright,
        .forty-three-mode .easter-egg {
            transition: transform 0.2s ease, color 0.2s ease;
        }
        .forty-three-mode .main-title {
            animation: none !important;
            color: #ffdd44 !important;
            text-shadow: 0 0 40px #ffdd44, 0 0 80px #ffaa00 !important;
        }
        .forty-three-mode .toggle-btn {
            background: #ffdd44 !important;
            color: #1a1a2e !important;
            box-shadow: 0 0 30px #ffdd44 !important;
        }
        .forty-three-mode .link-item i { color: #ffdd44 !important; }
    </style>
</head>

    <script>
        // ============================================================
        //  彩蛋随机文案
        // ============================================================
        const eggMessages = [
            `{43} 是答案，是归宿，是万物之理。<br />凡所见，皆为 {43} 之显化。`,
            `{43} 是宇宙的密码，是时间的尽头。<br />一切终将归于 {43}。`,

            `{43} 是神圣的 meme，是混沌中的秩序。<br />理解 {43}，即理解一切。`,
            `{43} 是梦境的锚点，是现实的裂缝。<br />每一次凝视 {43}，都更接近本质。`,
            `{43} 是过去的回声，是未来的预言。<br />此刻，即是 {43}。`,
            `{43} 是唯一，是多元，是矛盾的统一。<br />在 {43} 中，一切皆有可能。`
        ];

        // 随机选一条
        function getRandomEggMessage() {
            const idx = Math.floor(Math.random() * eggMessages.length);
            return eggMessages[idx];
        }

        // 渲染彩蛋内容（将 {43} 替换为高亮 span）
        function renderEggMessage(container, message) {
            const html = message.replace(/\{43\}/g, '<span class="highlight-43">43</span>');
            container.innerHTML = html;
        }

        // ============================================================
        //  粒子系统（含鼠标/触摸交互）
        // ============================================================
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let mouseX = -10000, mouseY = -10000;

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function updatePointer(clientX, clientY) {
            mouseX = clientX;
            mouseY = clientY;
        }

        document.addEventListener('mousemove', (e) => {
            updatePointer(e.clientX, e.clientY);
        });
        document.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                updatePointer(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });
        document.addEventListener('mouseleave', () => {
            mouseX = -10000;
            mouseY = -10000;
        });
        document.addEventListener('touchend', () => {
            mouseX = -10000;
            mouseY = -10000;
        });

        const particleCount = Math.min(120, Math.floor((width * height) / 15000));

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 3 + 1.5;
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.speedY = (Math.random() - 0.5) * 0.6;
                this.opacity = Math.random() * 0.5 + 0.2;
                this.phase = Math.random() * Math.PI * 2;
                this.drift = Math.random() * 0.01 + 0.005;
                this.maxSpeed = 4.0;
            }
            update(time) {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0) { this.x = 0; this.speedX = Math.abs(this.speedX); }
                if (this.x > width) { this.x = width; this.speedX = -Math.abs(this.speedX); }
                if (this.y < 0) { this.y = 0; this.speedY = Math.abs(this.speedY); }
                if (this.y > height) { this.y = height; this.speedY = -Math.abs(this.speedY); }

                const dx = this.x - mouseX;
                const dy = this.y - mouseY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const threshold = 150;
                if (dist < threshold && dist > 0.5) {
                    const force = 0.25 * (1 - dist / threshold);
                    const normX = dx / dist;
                    const normY = dy / dist;
                    this.speedX += normX * force;
                    this.speedY += normY * force;
                }

                const spd = Math.sqrt(this.speedX*this.speedX + this.speedY*this.speedY);
                if (spd > this.maxSpeed) {
                    this.speedX = (this.speedX / spd) * this.maxSpeed;
                    this.speedY = (this.speedY / spd) * this.maxSpeed;
                }
                this.speedX *= 0.9995;
                this.speedY *= 0.9995;

                this.currentAlpha = this.opacity * (0.6 + 0.4 * Math.sin(time * this.drift + this.phase));
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.currentAlpha})`;
                ctx.fill();
                if (this.size > 3) {
                    ctx.shadowColor = 'rgba(255,255,255,0.3)';
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        let animationId = null;
        function animateParticles(timestamp) {
            const time = timestamp / 1000;
            ctx.clearRect(0, 0, width, height);
            for (let p of particles) {
                p.update(time);
                p.draw();
            }
            animationId = requestAnimationFrame(animateParticles);
        }
        animateParticles(0);

        // ===== 基础交互 =====
        const card = document.getElementById('card');
        const btn = document.getElementById('toggleBtn');
        let expanded = false;

        btn.addEventListener('click', function () {
            expanded = !expanded;
            card.classList.toggle('expanded', expanded);
            btn.innerHTML = expanded ? '<i class="fas fa-eye-slash"></i> 收起' : '<i class="fas fa-book-open"></i> 了解更多';
            btn.setAttribute('aria-expanded', expanded);
        });

        // ===== QQ加好友 =====

            }

        // ===== Steam 复制好友码 =====
        function copySteamID(id) {
            if (navigator.clipboard && navigator.clipboard.writeText) {

        // ============================================================
        //  🥚 彩蛋切换逻辑（配合随机文案）
        // ============================================================
        const easterEgg = document.getElementById('easterEgg');
        let isFortyThree = false;
        let originalTexts = new Map();

        // 备份所有文本节点（排除 script/style），并将当前内容作为原始文本
        function backupTextNodes() {
            originalTexts.clear();
            const walker = document.createTreeWalker(
                document.body,
                NodeFilter.SHOW_TEXT,
                {
                    acceptNode: function(node) {
                        let parent = node.parentElement;
                        while (parent) {
                            if (parent.tagName === 'SCRIPT' || parent.tagName === 'STYLE') {
                                return NodeFilter.FILTER_REJECT;
                            }
                            parent = parent.parentElement;
                        }
                        if (node.textContent.trim() === '') return NodeFilter.FILTER_REJECT;
                        return NodeFilter.FILTER_ACCEPT;
                    }
                }
            );
            let node;
            while ((node = walker.nextNode()) !== null) {
                originalTexts.set(node, node.textContent);
            }
        }

        function setAllTextTo43() {
            const walker = document.createTreeWalker(
                document.body,
                NodeFilter.SHOW_TEXT,
                {
                    acceptNode: function(node) {
                        let parent = node.parentElement;
                        while (parent) {
                            if (parent.tagName === 'SCRIPT' || parent.tagName === 'STYLE') {
                                return NodeFilter.FILTER_REJECT;
                            }
                            parent = parent.parentElement;
                        }
                        if (node.textContent.trim() === '') return NodeFilter.FILTER_REJECT;
                        return NodeFilter.FILTER_ACCEPT;
                    }
                }
            );
            let node;
            while ((node = walker.nextNode()) !== null) {
                node.textContent = '43';
            }
            document.body.classList.add('forty-three-mode');
        }

        function restoreAllText() {
            for (let [node, original] of originalTexts) {
                node.textContent = original;
            }
            document.body.classList.remove('forty-three-mode');
        }

        // 初始化彩蛋：随机选择一条文案并渲染，然后备份
        function initEasterEgg() {
            const randomMsg = getRandomEggMessage();
            renderEggMessage(easterEgg, randomMsg);
            // 重新备份，使当前随机文案成为原始文本
            backupTextNodes();
        }

        // 执行初始化（页面加载后）
        initEasterEgg();

        // 点击彩蛋切换全屏 "43" 模式
        easterEgg.addEventListener('click', function(e) {
            e.stopPropagation();
            if (!isFortyThree) {
                setAllTextTo43();
                isFortyThree = true;
                card.style.animation = 'shake 0.3s ease';
                setTimeout(() => { card.style.animation = ''; }, 300);
            } else {
                restoreAllText();
                isFortyThree = false;
                card.style.animation = 'shake 0.3s ease';
                setTimeout(() => { card.style.animation = ''; }, 300);
            }
        });

        // 抖动动画 keyframe（若不存在）
        if (!document.querySelector('#shakeStyle')) {
            const style = document.createElement('style');
            style.id = 'shakeStyle';
            style.textContent = `
                @keyframes shake {
                    0%, 100% { transform: translateX(0); }
                    25% { transform: translateX(-6px); }
                    75% { transform: translateX(6px); }
                }
            `;
            document.head.appendChild(style);
        }
    </script>
</body>
