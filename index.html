<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="dede 的想法与分享" />
    <meta name="theme-color" content="#0a0a12" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>" />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>dede · 想法与分享</title>
</head>
<body data-theme="cyber">

    <!-- 终端乱码交互层 -->
    <canvas id="glitchCanvas" aria-hidden="true"></canvas>

    <!-- 风格切换 -->
    <button class="theme-toggle" id="themeToggle" role="button" aria-label="切换风格" title="切换风格">
        <i class="fas fa-sun"></i>
    </button>

    <!-- 彩蛋入口 -->
    <button class="egg-btn" id="eggBtn" role="button" aria-label="触发彩蛋" title="触发彩蛋">43</button>

    <!-- 首屏 -->
    <header class="hero" id="hero">
        <div class="hero-inner">
            <h1 class="hero-title" id="logo">dede</h1>
            <p class="hero-sub">记点想法，分享点东西。</p>
        </div>
    </header>

    <!-- 想法流 -->
    <main class="stream" id="stream">
        <div class="stream-head">
            <h2>最近的想法</h2>
            <span class="stream-count" id="streamCount"></span>
        </div>
        <div class="post-list" id="postList"></div>

        <!-- 小游戏入口壳子 -->
        <a class="game-shell" id="gameShell" href="javascript:void(0)" aria-label="小游戏（开发中）">
            <i class="fas fa-gamepad"></i> 小游戏 <span class="game-tag">开发中</span>
        </a>

        <!-- 实用小工具入口 -->
        <a class="game-shell" id="toolsEntry" href="#/tools" aria-label="实用小工具">
            <i class="fas fa-wrench"></i> 实用工具 <span class="game-tag">工具箱</span>
        </a>
    </main>

    <!-- 底部：个人信息（弱化） -->
    <footer class="footer" id="about">
        <div class="socials" id="socials"></div>

        <div class="faq" id="faq"></div>

        <div class="copyright">© 2050 · dede</div>
        <div class="beian">
            <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">豫ICP备2026041186号</a>
        </div>
        <!-- 43 彩蛋 -->
        <div class="easter-egg" id="easterEgg" role="button" aria-label="点击切换 43 彩蛋模式"></div>
    </footer>

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- 实用工具面板 -->
    <div class="tools-view" id="toolsView" aria-hidden="true">
        <div class="tools-panel">
            <div class="tools-head">
                <span class="tools-title"><i class="fas fa-wrench"></i> 实用工具</span>
                <button class="tools-close" id="toolsClose" aria-label="关闭">×</button>
            </div>
            <div class="tools-main">
                <div class="tools-tabs" id="toolsTabs" role="tablist"></div>
                <div class="tools-body" id="toolsBody"></div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/glitch.js"></script>
    <script src="js/main.js"></script>
    <script src="js/tools.js"></script>
</body>
</html>
