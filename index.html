<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="dede 的个人主页" />
    <meta name="theme-color" content="#0a0a12" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>" />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>dede</title>
</head>
<body data-theme="cyber">

    <!-- 终端乱码交互层 -->
    <canvas id="glitchCanvas" aria-hidden="true"></canvas>

    <!-- 风格切换 -->
    <button class="theme-toggle" id="themeToggle" role="button" aria-label="切换风格" title="切换风格">
        <i class="fas fa-sun"></i>
    </button>

    <!-- 彩蛋入口 -->
    <button class="egg-btn" id="eggBtn" role="button" aria-label="触发彩蛋" title="触发彩蛋">43</button>

    <!-- 首屏 -->
    <header class="hero" id="hero">
        <div class="hero-inner">
            <h1 class="hero-title" id="logo">dede</h1>
        </div>
    </header>

    <!-- 想法流 -->
    <main class="stream" id="stream">
        <div class="stream-head">
            <h2>最近的想法</h2>
            <span class="stream-count" id="streamCount"></span>
        </div>
        <div class="post-list" id="postList"></div>

        <!-- 小游戏入口 -->
        <a class="game-shell" id="gameShell" href="#/game" aria-label="俄罗斯方块">
            <i class="fas fa-gamepad"></i> 小游戏 <span class="game-tag">俄罗斯方块</span>
        </a>

        <!-- 实用小工具入口 -->
        <a class="game-shell" id="toolsEntry" href="#/tools" aria-label="实用小工具">
            <i class="fas fa-wrench"></i> 实用工具 <span class="game-tag">工具箱</span>
        </a>

        <!-- 世界观入口壳子 -->
        <a class="game-shell" id="worldEntry" href="world/index.html" aria-label="世界观（构建中）">
            <i class="fas fa-globe"></i> 世界观 <span class="game-tag">构建中</span>
        </a>
    </main>

    <!-- 底部：个人信息（弱化） -->
    <footer class="footer" id="about">
        <div class="socials" id="socials"></div>

        <div class="faq" id="faq"></div>

        <div class="copyright">© 2050 · dede</div>
        <div class="beian">
            <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">豫ICP备2026041186号</a>
        </div>
        <!-- 43 彩蛋 -->
        <div class="easter-egg" id="easterEgg" role="button" aria-label="点击切换 43 彩蛋模式"></div>
    </footer>

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- 实用工具面板 -->
    <div class="tools-view" id="toolsView" aria-hidden="true">
        <div class="tools-panel">
            <div class="tools-head">
                <span class="tools-title"><i class="fas fa-wrench"></i> 实用工具</span>
                <button class="tools-close" id="toolsClose" aria-label="关闭">×</button>
            </div>
            <div class="tools-main">
                <div class="tools-tabs" id="toolsTabs" role="tablist"></div>
                <div class="tools-body" id="toolsBody"></div>
            </div>
        </div>
    </div>

    <!-- 小游戏面板 -->
    <div class="game-view" id="gameView" aria-hidden="true">
        <div class="game-panel">
            <div class="game-head">
                <span class="game-title"><i class="fas fa-gamepad"></i> 俄罗斯方块</span>
                <button class="game-close" id="gameClose" aria-label="关闭">×</button>
            </div>
            <div class="game-main">
                <div class="game-stage">
                    <canvas id="gameCanvas"></canvas>
                    <div class="game-overlay" id="gameOverlay">
                        <div class="over-title" id="overTitle">GAME OVER</div>
                        <div class="over-score" id="overScore"></div>
                        <div class="over-hint" id="overHint">空格键重新开始</div>
                    </div>
                </div>
                <div class="game-side">
                    <div class="game-stat"><span>分数</span><strong id="gameScore">0</strong></div>
                    <div class="game-stat"><span>等级</span><strong id="gameLevel">1</strong></div>
                    <div class="game-stat"><span>行数</span><strong id="gameLines">0</strong></div>
                    <div class="game-next">
                        <span>下一个</span>
                        <canvas id="gameNextCanvas"></canvas>
                    </div>
                    <button class="game-btn" id="gameStart">重新开始</button>
                </div>
            </div>
            <div class="game-controls" id="gameControls">
                <button data-act="left" aria-label="左移">←</button>
                <button data-act="right" aria-label="右移">→</button>
                <button data-act="rotate" aria-label="旋转">↻</button>
                <button data-act="down" aria-label="下移">↓</button>
                <button data-act="drop" aria-label="硬降">⤓</button>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/glitch.js"></script>
    <script src="js/main.js"></script>
    <script src="js/tools.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
