<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dede · 个人主页</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ============================================================
           主题变量 · 默认主题（紫粉暗色）
           其他主题通过 body[data-theme="..."] 整体覆盖
        ============================================================ */
        :root {
            /* 背景 */
            --bg-a: #1a1a2e;
            --bg-b: #0f0c29;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.10);
            --card-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            --card-radius: 40px;
            --card-blur: blur(20px);

            /* 文字层级 */
            --text-1: #ffffff;                        /* 标题 / 主文字 */
            --text-2: rgba(255, 255, 255, 0.8);       /* 次级文字 */
            --text-3: rgba(255, 255, 255, 0.6);       /* 说明文字 */
            --text-4: rgba(255, 255, 255, 0.35);      /* 底部弱化 */
            --footer-hover: rgba(255, 255, 255, 0.5);

            /* 强调色 */
            --accent-1: #f093fb;
            --accent-2: #f5576c;
            --glow: rgba(245, 87, 108, 0.3);
            --glow-hover: rgba(245, 87, 108, 0.5);

            /* 按钮 */
            --btn-bg: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            --btn-color: #ffffff;

            /* 列表 / QA */
            --item-bg: rgba(255, 255, 255, 0.06);
            --item-bg-hover: rgba(255, 255, 255, 0.14);
            --item-text: rgba(255, 255, 255, 0.8);
            --qa-bg: rgba(255, 255, 255, 0.04);
            --qa-bg-hover: rgba(255, 255, 255, 0.09);
            --line: rgba(255, 255, 255, 0.08);
            --badge-bg: rgba(240, 147, 251, 0.14);

            /* 主标题 */
            --title-color: #ffffff;
            --title-shadow: 0 0 15px rgba(245, 87, 108, 0.5), 0 0 30px rgba(240, 147, 251, 0.3);
            --title-anim: float 3s ease-in-out infinite, rainbow 4s linear infinite;

            /* 彩蛋 */
            --easter-text: rgba(255, 255, 255, 0.12);
            --easter-hover: rgba(255, 255, 255, 0.4);
            --easter-bg-hover: rgba(255, 255, 255, 0.04);

            /* 面板 / Toast */
            --panel-bg: rgba(18, 18, 30, 0.92);
            --panel-border: rgba(255, 255, 255, 0.12);
            --panel-text: #ffffff;
            --panel-sub: rgba(255, 255, 255, 0.55);
            --toast-bg: rgba(18, 18, 30, 0.92);
            --toast-text: #ffffff;
        }

        /* ============================================================
           主题：星空蓝
        ============================================================ */
        body[data-theme="blue"] {
            --bg-a: #0e1a33;
            --bg-b: #060d1d;
            --accent-1: #5eb0ff;
            --accent-2: #3b82f6;
            --glow: rgba(59, 130, 246, 0.3);
            --glow-hover: rgba(59, 130, 246, 0.5);
            --title-shadow: 0 0 15px rgba(59, 130, 246, 0.5), 0 0 30px rgba(94, 176, 255, 0.3);
            --badge-bg: rgba(59, 130, 246, 0.14);
        }

        /* ============================================================
           主题：薄荷绿
        ============================================================ */
        body[data-theme="green"] {
            --bg-a: #0c241c;
            --bg-b: #050f0b;
            --accent-1: #4ade80;
            --accent-2: #14b8a6;
            --glow: rgba(20, 184, 166, 0.3);
            --glow-hover: rgba(20, 184, 166, 0.5);
            --title-shadow: 0 0 15px rgba(20, 184, 166, 0.5), 0 0 30px rgba(74, 222, 128, 0.3);
            --badge-bg: rgba(20, 184, 166, 0.14);
        }

        /* ============================================================
           主题：落日橙
        ============================================================ */
        body[data-theme="orange"] {
            --bg-a: #2b160e;
            --bg-b: #150905;
            --accent-1: #fbbf24;
            --accent-2: #f97316;
            --glow: rgba(249, 115, 22, 0.3);
            --glow-hover: rgba(249, 115, 22, 0.5);
            --title-shadow: 0 0 15px rgba(249, 115, 22, 0.5), 0 0 30px rgba(251, 191, 36, 0.3);
            --badge-bg: rgba(249, 115, 22, 0.14);
        }

        /* ============================================================
           主题：天空蓝（简约浅色 · 无彩虹 · 干净卡片）
        ============================================================ */
        body[data-theme="sky"] {
            --bg-a: #e9eef4;
            --bg-b: #d9e1ea;
            --card-bg: #ffffff;
            --card-border: rgba(23, 33, 43, 0.08);
            --card-shadow: 0 10px 40px rgba(30, 50, 80, 0.10);
            --card-radius: 20px;
            --card-blur: none;

            --text-1: #17212b;
            --text-2: #3c4b5c;
            --text-3: #708499;
            --text-4: rgba(23, 33, 43, 0.35);
            --footer-hover: rgba(23, 33, 43, 0.7);

            --accent-1: #3390ec;
            --accent-2: #2b7fda;
            --glow: rgba(51, 144, 236, 0.28);
            --glow-hover: rgba(51, 144, 236, 0.45);

            --btn-bg: linear-gradient(135deg, #3390ec, #2b7fda);
            --btn-color: #ffffff;

            --item-bg: #f2f6fa;
            --item-bg-hover: #e5edf6;
            --item-text: #2c3a49;
            --qa-bg: #f7fafc;
            --qa-bg-hover: #eef4fa;
            --line: rgba(23, 33, 43, 0.08);
            --badge-bg: rgba(51, 144, 236, 0.12);

            --title-color: #17212b;
            --title-shadow: none;
            --title-anim: none;

            --easter-text: rgba(23, 33, 43, 0.28);
            --easter-hover: rgba(23, 33, 43, 0.55);
            --easter-bg-hover: rgba(23, 33, 43, 0.05);

            --panel-bg: #ffffff;
            --panel-border: rgba(23, 33, 43, 0.10);
            --panel-text: #17212b;
            --panel-sub: #708499;
            --toast-bg: #17212b;
            --toast-text: #ffffff;
        }
        body[data-theme="sky"] .toggle-btn { border-radius: 10px; }
        body[data-theme="sky"] .link-item { border: 1px solid rgba(23, 33, 43, 0.06); }

        /* ---------- 重置 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background: radial-gradient(circle at 30% 30%, var(--bg-a), var(--bg-b));
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 20px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* ---------- 粒子画布 ---------- */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ---------- 卡片 ---------- */
        .card {
            position: relative;
            z-index: 1;
            width: 420px;
            max-width: 95%;
            min-height: 420px;
            margin: 20px auto;
            background: var(--card-bg);
            backdrop-filter: var(--card-blur);
            -webkit-backdrop-filter: var(--card-blur);
            border-radius: var(--card-radius);
            padding: 40px 30px;
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow);
            transition: width 0.6s cubic-bezier(0.25, 0.8, 0.25, 1),
                        padding 0.6s cubic-bezier(0.25, 0.8, 0.25, 1),
                        min-height 0.6s cubic-bezier(0.25, 0.8, 0.25, 1),
                        background 0.4s ease,
                        border-color 0.4s ease,
                        color 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--text-1);
            will-change: width, padding, min-height;
            overflow: visible;
        }

        /* ---------- 主视觉 ---------- */
        .main-title {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(1);
            font-size: 72px;
            font-weight: 900;
            letter-spacing: 4px;
            z-index: 2;
            user-select: none;
            color: var(--title-color);
            animation: var(--title-anim);
            transition: left 0.7s cubic-bezier(0.25, 0.8, 0.25, 1),
                        top 0.7s cubic-bezier(0.25, 0.8, 0.25, 1),
                        transform 0.7s cubic-bezier(0.25, 0.8, 0.25, 1),
                        font-size 0.7s cubic-bezier(0.25, 0.8, 0.25, 1),
                        color 0.4s ease;
            will-change: left, top, transform, font-size;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) translateY(0); }
            50% { transform: translate(-50%, -50%) translateY(-10px); }
        }

        @keyframes rainbow {
            0% {
                color: #ff0000;
                text-shadow: 0 0 20px rgba(255, 0, 0, 0.7), 0 0 60px rgba(255, 0, 0, 0.5);
            }
            17% {
                color: #ff8800;
                text-shadow: 0 0 20px rgba(255, 136, 0, 0.7), 0 0 60px rgba(255, 136, 0, 0.5);
            }
            33% {
                color: #ffff00;
                text-shadow: 0 0 20px rgba(255, 255, 0, 0.7), 0 0 60px rgba(255, 255, 0, 0.5);
            }
            50% {
                color: #00ff00;
                text-shadow: 0 0 20px rgba(0, 255, 0, 0.7), 0 0 60px rgba(0, 255, 0, 0.5);
            }
            67% {
                color: #0088ff;
                text-shadow: 0 0 20px rgba(0, 136, 255, 0.7), 0 0 60px rgba(0, 136, 255, 0.5);
            }
            83% {
                color: #8800ff;
                text-shadow: 0 0 20px rgba(136, 0, 255, 0.7), 0 0 60px rgba(136, 0, 255, 0.5);
            }
            100% {
                color: #ff0000;
                text-shadow: 0 0 20px rgba(255, 0, 0, 0.7), 0 0 60px rgba(255, 0, 0, 0.5);
            }
        }

        /* ---------- 按钮 ---------- */
        .toggle-btn {
            position: relative;
            z-index: 3;
            margin-top: 220px;
            background: var(--btn-bg);
            border: none;
            color: var(--btn-color);
            padding: 12px 36px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 20px var(--glow);
            transition: transform 0.2s, box-shadow 0.2s, margin-top 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
            will-change: margin-top, transform;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .toggle-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px var(--glow-hover);
        }

        .toggle-btn i {
            font-size: 18px;
        }

        /* ---------- 内容区域 ---------- */
        .content {
            width: 100%;
            opacity: 0;
            transform: scaleY(0.8) translateY(-20px);
            transform-origin: top center;
            transition: opacity 0.6s ease, transform 0.7s cubic-bezier(0.25, 0.8, 0.25, 1);
            max-height: 0;
            overflow: hidden;
            text-align: left;
            border-top: 1px solid transparent;
            will-change: opacity, transform;
            position: relative;
            z-index: 1;
        }

        .content .name {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
            text-align: center;
        }

        .content .subtitle {
            font-size: 16px;
            color: var(--text-3);
            margin-bottom: 18px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .content .subtitle i { color: var(--accent-1); }

        .link-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 16px 0;
        }
        .link-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--item-bg);
            border-radius: 12px;
            text-decoration: none;
            color: var(--item-text);
            font-size: 14px;
            transition: background 0.3s;
            cursor: pointer;
        }
        .link-item:hover { background: var(--item-bg-hover); }
        .link-item i {
            font-size: 18px;
            width: 20px;
            text-align: center;
            color: var(--accent-1);
        }

        /* ---------- 小游戏入口（占位，功能开发中） ---------- */
        .game-entry {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 14px;
            padding: 12px 14px;
            background: var(--item-bg);
            border: 1.5px dashed var(--accent-1);
            border-radius: 14px;
            color: var(--item-text);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            user-select: none;
        }
        .game-entry:hover {
            background: var(--item-bg-hover);
            transform: translateY(-1px);
        }
        .game-entry i {
            color: var(--accent-1);
            font-size: 17px;
        }
        .game-entry .badge {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent-1);
            background: var(--badge-bg);
            padding: 2px 8px;
            border-radius: 20px;
        }

        /* ---------- QA ---------- */
        .qa-static {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
        }
        .qa-static .section-title {
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .qa-static .section-title i { color: var(--accent-1); }
        .qa-static .qa-item {
            background: var(--qa-bg);
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 12px;
            border-left: 3px solid var(--accent-1);
            transition: background 0.2s;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .qa-static .qa-item:hover { background: var(--qa-bg-hover); }
        .qa-static .qa-question {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-2);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .qa-static .qa-question i {
            color: var(--accent-1);
            font-size: 16px;
            width: 18px;
        }
        .qa-static .qa-answer {
            font-size: 14px;
            color: var(--text-3);
            line-height: 1.5;
            padding-left: 26px;
        }

        /* ---------- 底部 ---------- */
        .footer {
            margin-top: 24px;
            text-align: center;
            color: var(--text-4);
            font-size: 13px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .footer .copyright { color: var(--text-4); }
        .footer .beian a {
            color: var(--text-4);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s;
        }
        .footer .beian a:hover {
            color: var(--footer-hover);
        }

        /* 彩蛋样式 - 容器保留，内容由 JS 动态生成 */
        .footer .easter-egg {
            font-size: 13px;
            color: var(--easter-text);
            letter-spacing: 2px;
            cursor: pointer;
            user-select: none;
            font-weight: 300;
            line-height: 1.6;
            max-width: 320px;
            margin: 0 auto;
            padding: 8px 12px;
            border-radius: 12px;
            background: transparent;
            transition: background 0.3s ease, color 0.3s ease, text-shadow 0.3s ease;
        }
        .footer .easter-egg:hover {
            color: var(--easter-hover);
            text-shadow: 0 0 20px var(--glow);
            background: var(--easter-bg-hover);
        }
        .footer .easter-egg .highlight-43 {
            color: rgba(255, 200, 100, 0.25);
            font-weight: 600;
            transition: color 0.4s ease;
        }
        .footer .easter-egg:hover .highlight-43 {
            color: rgba(255, 200, 100, 0.6);
            text-shadow: 0 0 30px rgba(255, 200, 100, 0.2);
        }

        /* ---------- 展开状态 ---------- */
        .card.expanded {
            width: 90%;
            max-width: 800px;
            min-height: auto;
            padding: 30px 30px 40px;
            align-items: flex-start;
            justify-content: flex-start;
            text-align: left;
        }
        .card.expanded .main-title {
            left: 30px;
            top: 30px;
            transform: translate(0, 0) scale(0.5);
            font-size: 72px;
            animation: none;
            color: var(--title-color);
            text-shadow: var(--title-shadow);
        }
        .card.expanded .toggle-btn {
            margin-top: 0;
            margin-left: auto;
            margin-right: 0;
        }
        .card.expanded .content {
            opacity: 1;
            transform: scaleY(1) translateY(0);
            max-height: 3000px;
            border-top-color: var(--line);
            padding-top: 20px;
            margin-top: 10px;
        }

        /* ---------- 主题切换按钮 ---------- */
        .theme-fab {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 20;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--panel-border);
            background: var(--panel-bg);
            color: var(--panel-text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: transform 0.2s ease;
        }
        .theme-fab:hover { transform: translateY(-2px) scale(1.05); }
        .theme-fab i { pointer-events: none; }

        /* ---------- 主题面板 ---------- */
        .theme-panel {
            position: fixed;
            top: 72px;
            right: 18px;
            z-index: 20;
            width: 224px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--panel-text);
            display: none;
        }
        .theme-panel.open {
            display: block;
            animation: panelIn 0.2s ease;
        }
        @keyframes panelIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .theme-panel-title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--panel-sub);
            padding: 4px 8px 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .theme-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            color: var(--panel-text);
            transition: background 0.2s;
            outline: none;
        }
        .theme-option:hover { background: var(--item-bg-hover); }
        .theme-option:focus-visible { box-shadow: 0 0 0 2px var(--glow); }
        .theme-option .swatch {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 1px solid rgba(0, 0, 0, 0.15);
        }
        .theme-option .name { flex: 1; }
        .theme-option .check {
            color: var(--accent-1);
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .theme-option.active .check { opacity: 1; }

        /* ---------- Toast ---------- */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%) translateY(20px);
            background: var(--toast-bg);
            color: var(--toast-text);
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 30;
            max-width: 90vw;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 600px) {
            .card {
                width: 95%;
                min-height: 350px;
                padding: 30px 20px;
            }
            .main-title { font-size: 52px; letter-spacing: 2px; }
            .toggle-btn { margin-top: 180px; font-size: 14px; padding: 10px 28px; }
            .card.expanded .main-title {
                left: 20px; top: 20px;
                transform: translate(0, 0) scale(0.5);
                font-size: 52px;
            }
            .card.expanded .toggle-btn { margin-top: 0; }
            .link-grid { grid-template-columns: 1fr; }
            .content .name { font-size: 24px; }
            .qa-static .qa-answer { padding-left: 0; }
            .footer .easter-egg { font-size: 12px; max-width: 260px; }
            .theme-fab { top: 12px; right: 12px; width: 40px; height: 40px; }
            .theme-panel { top: 62px; right: 12px; }
        }
        @media (max-width: 400px) {
            .footer .easter-egg { font-size: 11px; max-width: 200px; }
        }

        /* ---------- 彩蛋模式 ---------- */
        .forty-three-mode .main-title,
        .forty-three-mode .name,
        .forty-three-mode .subtitle,
        .forty-three-mode .qa-question,
        .forty-three-mode .qa-answer,
        .forty-three-mode .link-item,
        .forty-three-mode .toggle-btn,
        .forty-three-mode .copyright,
        .forty-three-mode .easter-egg {
            transition: transform 0.2s ease, color 0.2s ease;
        }
        .forty-three-mode .main-title {
            animation: none !important;
            color: #ffdd44 !important;
            text-shadow: 0 0 40px #ffdd44, 0 0 80px #ffaa00 !important;
        }
        .forty-three-mode .toggle-btn {
            background: #ffdd44 !important;
            color: #1a1a2e !important;
            box-shadow: 0 0 30px #ffdd44 !important;
        }
        .forty-three-mode .link-item i { color: #ffdd44 !important; }

                <!-- 彩蛋容器：内容由 JS 动态渲染 -->

    <!-- Toast 提示 -->

    <script>
        // ============================================================
        //  彩蛋随机文案
        // ============================================================
        const eggMessages = [
            `{43} 是答案，是归宿，是万物之理。<br />凡所见，皆为 {43} 之显化。`,
            `{43} 是宇宙的密码，是时间的尽头。<br />一切终将归于 {43}。`,
            `{43} 是神之数，是创世的回响。<br />万物始于 {43}，终于 {43}。`,
            `{43} 是永恒的真理，是虚无的边界。<br />你与我，皆是 {43} 的倒影。`,
            `{43} 是神圣的 meme，是混沌中的秩序。<br />理解 {43}，即理解一切。`,
            `{43} 是梦境的锚点，是现实的裂缝。<br />每一次凝视 {43}，都更接近本质。`,
            `{43} 是过去的回声，是未来的预言。<br />此刻，即是 {43}。`,
            `{43} 是唯一，是多元，是矛盾的统一。<br />在 {43} 中，一切皆有可能。`
        ];

        // 随机选一条
        function getRandomEggMessage() {
            const idx = Math.floor(Math.random() * eggMessages.length);
            return eggMessages[idx];
        }

        // 渲染彩蛋内容（将 {43} 替换为高亮 span）
        function renderEggMessage(container, message) {
            const html = message.replace(/\{43\}/g, '<span class="highlight-43">43</span>');
            container.innerHTML = html;
        }

        // ============================================================
        //  粒子系统（含鼠标/触摸交互，颜色随主题变化）
        // ============================================================
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let mouseX = -10000, mouseY = -10000;
        let particleRGB = '255, 255, 255';

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function updatePointer(clientX, clientY) {
            mouseX = clientX;
            mouseY = clientY;
        }

        document.addEventListener('mousemove', (e) => {
            updatePointer(e.clientX, e.clientY);
        });
        document.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                updatePointer(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });
        document.addEventListener('mouseleave', () => {
            mouseX = -10000;
            mouseY = -10000;
        });
        document.addEventListener('touchend', () => {
            mouseX = -10000;
            mouseY = -10000;
        });

        const particleCount = Math.min(120, Math.floor((width * height) / 15000));

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 3 + 1.5;
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.speedY = (Math.random() - 0.5) * 0.6;
                this.opacity = Math.random() * 0.5 + 0.2;
                this.phase = Math.random() * Math.PI * 2;
                this.drift = Math.random() * 0.01 + 0.005;
                this.maxSpeed = 4.0;
            }
            update(time) {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0) { this.x = 0; this.speedX = Math.abs(this.speedX); }
                if (this.x > width) { this.x = width; this.speedX = -Math.abs(this.speedX); }
                if (this.y < 0) { this.y = 0; this.speedY = Math.abs(this.speedY); }
                if (this.y > height) { this.y = height; this.speedY = -Math.abs(this.speedY); }

                const dx = this.x - mouseX;
                const dy = this.y - mouseY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const threshold = 150;
                if (dist < threshold && dist > 0.5) {
                    const force = 0.25 * (1 - dist / threshold);
                    const normX = dx / dist;
                    const normY = dy / dist;
                    this.speedX += normX * force;
                    this.speedY += normY * force;
                }

                const spd = Math.sqrt(this.speedX*this.speedX + this.speedY*this.speedY);
                if (spd > this.maxSpeed) {
                    this.speedX = (this.speedX / spd) * this.maxSpeed;
                    this.speedY = (this.speedY / spd) * this.maxSpeed;
                }
                this.speedX *= 0.9995;
                this.speedY *= 0.9995;

                this.currentAlpha = this.opacity * (0.6 + 0.4 * Math.sin(time * this.drift + this.phase));
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${particleRGB}, ${this.currentAlpha})`;
                ctx.fill();
                if (this.size > 3) {
                    ctx.shadowColor = `rgba(${particleRGB}, 0.3)`;
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        let animationId = null;
        function animateParticles(timestamp) {
            const time = timestamp / 1000;
            ctx.clearRect(0, 0, width, height);
            for (let p of particles) {
                p.update(time);
                p.draw();
            }
            animationId = requestAnimationFrame(animateParticles);
        }
        animateParticles(0);

        // ============================================================
        //  Toast 提示
        // ============================================================
        let toastTimer = null;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () {
                toast.classList.remove('show');
            }, 2200);
        }

        // ============================================================
        //  主题系统
        // ============================================================
        // 每个主题可配置粒子颜色（浅色主题用灰蓝粒子）
        const THEMES = {
            sky:      { particle: '96, 122, 150' },
            default:  { particle: '255, 255, 255' },
            blue:     { particle: '255, 255, 255' },
            green:    { particle: '255, 255, 255' },
            orange:   { particle: '255, 255, 255' }
        };

        function applyTheme(name, save) {
            const key = THEMES[name] ? name : 'default';
            document.body.setAttribute('data-theme', key);
            particleRGB = THEMES[key].particle;
            document.querySelectorAll('.theme-option').forEach(opt => {
                opt.classList.toggle('active', opt.dataset.theme === key);
            });
            if (save) {
                try { localStorage.setItem('dede-theme-v2', key); } catch (e) {}
            }
        }

        // 初始化主题（优先读取本地保存的偏好）
        let savedTheme = 'sky';
        try { savedTheme = localStorage.getItem('dede-theme-v2') || 'sky'; } catch (e) {}
        applyTheme(savedTheme, false);

        // 面板开关
        const themeFab = document.getElementById('themeFab');
        const themePanel = document.getElementById('themePanel');

        function openPanel(open) {
            themePanel.classList.toggle('open', open);
            themeFab.setAttribute('aria-expanded', open);
        }

        themeFab.addEventListener('click', function (e) {
            e.stopPropagation();
            openPanel(!themePanel.classList.contains('open'));
        });
        themeFab.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                themeFab.click();
            }
        });

        // 点击面板外部 / Esc 关闭
        document.addEventListener('click', function (e) {
            if (!themePanel.contains(e.target) && !themeFab.contains(e.target)) {
                openPanel(false);
            }
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                openPanel(false);
            }
        });

        // 主题选项
        document.querySelectorAll('.theme-option').forEach(opt => {
            function pick() {
                applyTheme(opt.dataset.theme, true);
                showToast('已切换主题 · ' + opt.querySelector('.name').textContent);
                openPanel(false);
            }
            opt.addEventListener('click', pick);
            opt.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    pick();
                }
            });
        });

        // ============================================================
        //  小游戏入口（占位，开发中）
        // ============================================================
        const gameEntry = document.getElementById('gameEntry');
        function gameComingSoon() {
            showToast('小游戏开发中，敬请期待');
        }
        gameEntry.addEventListener('click', gameComingSoon);
        gameEntry.addEventListener('keydown', function (e) {

                e.preventDefault();
                gameComingSoon();

        });

        // ===== 基础交互 =====
        const card = document.getElementById('card');
        const btn = document.getElementById('toggleBtn');
        let expanded = false;

        btn.addEventListener('click', function () {
            expanded = !expanded;

            btn.innerHTML = expanded ? '<i class="fas fa-eye-slash"></i> 收起' : '<i class="fas fa-book-open"></i> 了解更多';
            btn.setAttribute('aria-expanded', expanded);
        });

        // ===== QQ加好友 =====
        function addQQFriend(qq) {
            const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        // ===== Steam 复制好友码 =====
        function copySteamID(id) {

            } else {

        }

        // ============================================================
        //  彩蛋切换逻辑（配合随机文案）
        // ============================================================
        const easterEgg = document.getElementById('easterEgg');
        let isFortyThree = false;
        let originalTexts = new Map();

        // 备份所有文本节点（排除 script/style），并将当前内容作为原始文本
        function backupTextNodes() {
            originalTexts.clear();
            const walker = document.createTreeWalker(
                document.body,
                NodeFilter.SHOW_TEXT,
                {
                    acceptNode: function(node) {
                        let parent = node.parentElement;
                        while (parent) {
                            if (parent.tagName === 'SCRIPT' || parent.tagName === 'STYLE') {
                                return NodeFilter.FILTER_REJECT;
                            }
                            parent = parent.parentElement;
                        }
                        if (node.textContent.trim() === '') return NodeFilter.FILTER_REJECT;
                        return NodeFilter.FILTER_ACCEPT;
                    }
                }
            );
            let node;
            while ((node = walker.nextNode()) !== null) {
                originalTexts.set(node, node.textContent);
            }
        }

        function setAllTextTo43() {
            const walker = document.createTreeWalker(
                document.body,
                NodeFilter.SHOW_TEXT,
                {
                    acceptNode: function(node) {
                        let parent = node.parentElement;
                        while (parent) {
                            if (parent.tagName === 'SCRIPT' || parent.tagName === 'STYLE') {
                                return NodeFilter.FILTER_REJECT;
                            }
                            parent = parent.parentElement;
                        }
                        if (node.textContent.trim() === '') return NodeFilter.FILTER_REJECT;
                        return NodeFilter.FILTER_ACCEPT;
                    }
                }
            );
            let node;
            while ((node = walker.nextNode()) !== null) {
                node.textContent = '43';
            }
            document.body.classList.add('forty-three-mode');
        }

        function restoreAllText() {
            for (let [node, original] of originalTexts) {
                node.textContent = original;
            }
            document.body.classList.remove('forty-three-mode');
        }

        // 初始化彩蛋：随机选择一条文案并渲染，然后备份
        function initEasterEgg() {
            const randomMsg = getRandomEggMessage();
            renderEggMessage(easterEgg, randomMsg);
            // 重新备份，使当前随机文案成为原始文本
            backupTextNodes();
        }

        // 执行初始化（页面加载后）
        initEasterEgg();

        // 点击彩蛋切换全屏 "43" 模式
        easterEgg.addEventListener('click', function(e) {
            e.stopPropagation();
            if (!isFortyThree) {
                setAllTextTo43();
                isFortyThree = true;
                card.style.animation = 'shake 0.3s ease';
                setTimeout(() => { card.style.animation = ''; }, 300);
            } else {
                restoreAllText();
                isFortyThree = false;
                card.style.animation = 'shake 0.3s ease';
                setTimeout(() => { card.style.animation = ''; }, 300);
            }
        });

        // 抖动动画 keyframe（若不存在）
        if (!document.querySelector('#shakeStyle')) {
            const style = document.createElement('style');
            style.id = 'shakeStyle';
            style.textContent = `
                @keyframes shake {
                    0%, 100% { transform: translateX(0); }
                    25% { transform: translateX(-6px); }
                    75% { transform: translateX(6px); }
                }
            `;
            document.head.appendChild(style);
        }
    </script>
