<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="dede 的世界观设定" />
    <meta name="theme-color" content="#14110E" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2314110E'/><text x='50' y='60' font-size='50' font-family='monospace' fill='%23D9A85C' text-anchor='middle'>43</text></svg>" />
    <title>世界观 · dede</title>
    <style>
        /* 与主站共用同一套配色与字体：夜间黄铜 */
        :root {
            --bg: #14110E;
            --surface: #1C1814;
            --hairline: rgba(232, 220, 192, 0.14);
            --text-1: #E8DCC0;
            --text-2: #A7967A;
            --accent: #D9A85C;
            --rust: #D2543A;
            --font-mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, "SF Mono", monospace;
            --font-serif: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "STSong", SimSun, serif;
            --font-sans: "PingFang SC", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text-1);
            font-family: var(--font-sans);
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        a { color: inherit; text-decoration: none; }
        :focus { outline: none; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .wrap {
            max-width: 720px;
            margin: 0 auto;
            padding: 72px 24px 64px;
        }

        /* ---------- 铭牌首屏 ---------- */
        .hero {
            border: 1px solid var(--hairline);
            background: var(--surface);
            padding: 36px 40px 28px;
            position: relative;
        }
        .hero::before {
            content: "";
            position: absolute;
            inset: 4px;
            border: 1px solid var(--hairline);
            opacity: 0.6;
            pointer-events: none;
        }
        .hero-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 24px;
        }
        .hero-title {
            font-family: var(--font-serif);
            font-size: 40px;
            line-height: 1.15;
            letter-spacing: -0.01em;
            font-weight: 400;
            color: var(--text-1);
        }
        .hero-no {
            font-family: var(--font-mono);
            font-size: 20px;
            letter-spacing: 0.08em;
            color: var(--accent);
            white-space: nowrap;
            padding-top: 6px;
        }
        .hero-sub {
            margin-top: 12px;
            font-family: var(--font-mono);
            font-size: 12px;
            letter-spacing: 0.08em;
            color: var(--text-2);
        }
        .hero-status {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 40px;
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid var(--hairline);
        }
        .hero-status-item {
            font-family: var(--font-mono);
            font-size: 12px;
            letter-spacing: 0.08em;
            color: var(--text-2);
        }
        .hero-status-item b { font-weight: 400; color: var(--text-1); }

        /* ---------- 齿轮（「构建中」单一符号，静态） ---------- */
        .gear-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 40px 0 28px;
            color: var(--text-2);
            font-family: var(--font-mono);
            font-size: 12px;
            letter-spacing: 0.08em;
        }
        .gear-row svg { width: 22px; height: 22px; color: var(--accent); flex: 0 0 auto; }

        /* ---------- 状态头 ---------- */
        .stream-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 4px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--hairline);
        }
        .stream-head h2 {
            font-family: var(--font-serif);
            font-size: 28px;
            font-weight: 400;
            letter-spacing: -0.01em;
            line-height: 1.15;
            color: var(--text-1);
        }
        .stream-note {
            font-family: var(--font-mono);
            font-size: 12px;
            letter-spacing: 0.08em;
            color: var(--text-2);
        }

        /* ---------- 设定清单 ---------- */
        .world-list { display: flex; flex-direction: column; }
        .world-item {
            display: grid;
            grid-template-columns: 48px 1fr auto;
            align-items: center;
            gap: 16px;
            padding: 20px 4px;
            border-bottom: 1px solid var(--hairline);
        }
        .world-no {
            font-family: var(--font-mono);
            font-size: 12px;
            letter-spacing: 0.08em;
            color: var(--accent);
        }
        .world-title {
            font-family: var(--font-serif);
            font-size: 20px;
            letter-spacing: -0.01em;
            line-height: 1.15;
            color: var(--text-1);
        }
        .world-status {
            font-family: var(--font-mono);
            font-size: 12px;
            letter-spacing: 0.08em;
            color: var(--text-2);
        }

        /* ---------- 返回按钮 ---------- */
        .back-row { margin-top: 40px; }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 22px;
            border: 1px solid var(--hairline);
            border-radius: 2px;
            background: var(--surface);
            color: var(--accent);
            font-family: var(--font-mono);
            font-size: 14px;
            letter-spacing: 0.04em;
            transition: color 0.15s ease-out, border-color 0.15s ease-out;
        }
        .back-btn:hover { border-color: var(--accent); }
        .back-btn:active { transform: translateY(1px); }
        .back-btn svg { width: 16px; height: 16px; }

        /* ---------- 页脚 ---------- */
        .foot {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-top: 56px;
            padding-top: 20px;
            border-top: 1px solid var(--hairline);
            font-family: var(--font-mono);
            font-size: 12px;
            letter-spacing: 0.08em;
            color: var(--text-2);
        }
        .foot .foot-no { color: var(--accent); }

        @media (max-width: 600px) {
            .wrap { padding: 56px 16px 48px; }
            .hero { padding: 24px 20px 20px; }
            .hero-title { font-size: 32px; }
            .world-item { grid-template-columns: 40px 1fr auto; padding: 18px 2px; }
        }
    </style>
</head>
<body>

    <!-- 齿轮符号定义 -->
    <svg style="display:none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <symbol id="gear" viewBox="0 0 200 200">
            <g fill="currentColor">
                <rect x="88" y="8" width="24" height="38" rx="4" transform="rotate(0 100 100)"/>
                <rect x="88" y="8" width="24" height="38" rx="4" transform="rotate(45 100 100)"/>
                <rect x="88" y="8" width="24" height="38" rx="4" transform="rotate(90 100 100)"/>
                <rect x="88" y="8" width="24" height="38" rx="4" transform="rotate(135 100 100)"/>
                <rect x="88" y="8" width="24" height="38" rx="4" transform="rotate(180 100 100)"/>
                <rect x="88" y="8" width="24" height="38" rx="4" transform="rotate(225 100 100)"/>
                <rect x="88" y="8" width="24" height="38" rx="4" transform="rotate(270 100 100)"/>
                <rect x="88" y="8" width="24" height="38" rx="4" transform="rotate(315 100 100)"/>
                <circle cx="100" cy="100" r="58"/>
            </g>
            <circle cx="100" cy="100" r="26" style="fill: var(--bg)"/>
            <circle cx="100" cy="100" r="12" fill="currentColor"/>
        </symbol>
    </svg>

    <div class="wrap">
        <!-- 铭牌首屏 -->
        <header class="hero">
            <div class="hero-top">
                <h1 class="hero-title">世界观</h1>
                <span class="hero-no">№ 43</span>
            </div>
            <p class="hero-sub">蒸汽中世纪 · 架空星球</p>
            <div class="hero-status">
                <span class="hero-status-item">状态 · <b>构建中</b></span>
                <span class="hero-status-item">条目 · <b>4</b></span>
            </div>
        </header>

        <!-- 齿轮：单一「构建中」符号 -->
        <div class="gear-row">
            <svg viewBox="0 0 200 200" aria-hidden="true"><use href="#gear"/></svg>
            <span>构建中</span>
        </div>

        <!-- 设定清单（待填） -->
        <main class="stream">
            <div class="stream-head">
                <h2>设定目录</h2>
                <span class="stream-note">内容未定</span>
            </div>

            <div class="world-list">
                <div class="world-item">
                    <span class="world-no">01</span>
                    <span class="world-title">地理</span>
                    <span class="world-status">未定</span>
                </div>
                <div class="world-item">
                    <span class="world-no">02</span>
                    <span class="world-title">历史</span>
                    <span class="world-status">未定</span>
                </div>
                <div class="world-item">
                    <span class="world-no">03</span>
                    <span class="world-title">国家</span>
                    <span class="world-status">未定</span>
                </div>
                <div class="world-item">
                    <span class="world-no">04</span>
                    <span class="world-title">技术</span>
                    <span class="world-status">未定</span>
                </div>
            </div>

            <!-- 返回 -->
            <div class="back-row">
                <a class="back-btn" href="../index.html" aria-label="返回主页">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
                    返回主页
                </a>
            </div>
        </main>

        <div class="foot">
            <span class="foot-no">№ 43</span>
            <span>© 2050 · dede</span>
        </div>
    </div>

</body>
</html>
