<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="dede 的世界观设定" />
    <meta name="theme-color" content="#15100c" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>⚙</text></svg>" />
    <title>世界观 · dede</title>
    <style>
        :root {
            --bg: #15100c;
            --bg-2: #1c1510;
            --brass: #c08a3e;
            --brass-2: #e2b866;
            --copper: #a05c2c;
            --ink: #e8dcc0;
            --ink-2: #b09a6f;
            --line: #6b4f2a;
            --gear-hole: #15100c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            min-height: 100vh;
            background:
                radial-gradient(1100px 560px at 50% -8%, rgba(192, 138, 62, .14), transparent 60%),
                radial-gradient(820px 520px at 104% 108%, rgba(160, 92, 44, .12), transparent 55%),
                linear-gradient(180deg, #1a140f, #120e0a 70%, #0e0a07);
            color: var(--ink);
            font-family: "Georgia", "Times New Roman", "Songti SC", "SimSun", serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ---------- 齿轮装饰 ---------- */
        .gear-fixed {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            animation: spin 140s linear infinite;
        }
        .gear-fixed.g1 { width: 720px; top: -180px; right: -160px; color: rgba(192, 138, 62, .07); }
        .gear-fixed.g2 { width: 460px; bottom: -120px; left: -120px; color: rgba(192, 138, 62, .06); animation-direction: reverse; animation-duration: 190s; }

        @keyframes spin { to { transform: rotate(360deg); } }

        .wrap {
            position: relative;
            z-index: 1;
            max-width: 860px;
            margin: 0 auto;
            padding: 56px 24px 64px;
        }

        /* ---------- 顶部装饰线 ---------- */
        .topbar {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 52px;
            color: var(--line);
        }
        .topbar::before, .topbar::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--line), transparent);
        }
        .topbar-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--brass-2);
            box-shadow: 0 0 0 3px rgba(226, 184, 102, .15);
        }

        /* ---------- 首屏 ---------- */
        .hero { text-align: center; }
        .hero-label {
            display: inline-block;
            font-size: 12px;
            letter-spacing: .42em;
            text-indent: .42em;
            color: var(--ink-2);
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        .hero-title {
            font-size: clamp(48px, 9vw, 96px);
            font-weight: 700;
            letter-spacing: .14em;
            text-indent: .14em;
            line-height: 1.05;
            background: linear-gradient(180deg, #f4dca4 0%, #d9a957 48%, #8a5a22 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            filter: drop-shadow(0 2px 18px rgba(192, 138, 62, .18));
        }
        .hero-sub {
            margin-top: 22px;
            font-size: 15px;
            letter-spacing: .34em;
            text-indent: .34em;
            color: var(--ink-2);
        }

        .hero-gears {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 22px;
            margin-top: 30px;
        }
        .hero-gears svg { color: var(--brass); }
        .hero-gears .gear-s { width: 52px; animation: spin 36s linear infinite; }
        .hero-gears .gear-xs { width: 30px; animation: spin 24s linear infinite reverse; }

        /* ---------- 分隔线 ---------- */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 46px 0 30px;
            color: var(--brass);
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--line), transparent);
        }
        .divider svg { width: 22px; animation: spin 30s linear infinite; }

        /* ---------- 状态头 ---------- */
        .stream-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--line);
        }
        .stream-head h2 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: .18em;
            color: var(--brass-2);
        }
        .stream-note { font-size: 12px; letter-spacing: .1em; color: var(--ink-2); }

        /* ---------- 设定槽位 ---------- */
        .world-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }
        .world-slot {
            position: relative;
            min-height: 128px;
            padding: 22px 20px 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid var(--line);
            outline: 1px solid rgba(192, 138, 62, .16);
            outline-offset: 3px;
            background:
                radial-gradient(circle at 9px 9px, var(--brass-2) 0 2.5px, transparent 3.5px),
                radial-gradient(circle at calc(100% - 9px) 9px, var(--brass-2) 0 2.5px, transparent 3.5px),
                radial-gradient(circle at 9px calc(100% - 9px), var(--brass-2) 0 2.5px, transparent 3.5px),
                radial-gradient(circle at calc(100% - 9px) calc(100% - 9px), var(--brass-2) 0 2.5px, transparent 3.5px),
                linear-gradient(160deg, rgba(192, 138, 62, .09), rgba(0, 0, 0, .22));
            transition: outline-color .25s ease, border-color .25s ease, transform .25s ease;
        }
        .world-slot:hover {
            border-color: var(--brass);
            outline-color: var(--brass);
            transform: translateY(-3px);
        }
        .slot-head { display: flex; align-items: flex-start; gap: 14px; }
        .slot-no {
            font-size: 22px;
            line-height: 1;
            color: var(--copper);
            font-family: "Georgia", serif;
        }
        .slot-title { font-size: 17px; font-weight: 600; letter-spacing: .12em; color: var(--ink); }
        .slot-en {
            margin-top: 3px;
            font-size: 10px;
            letter-spacing: .26em;
            color: var(--ink-2);
            text-transform: uppercase;
        }
        .slot-hint {
            margin-top: 16px;
            font-size: 12px;
            letter-spacing: .1em;
            color: var(--ink-2);
            opacity: .6;
        }

        /* ---------- 返回按钮 ---------- */
        .back-row { margin-top: 44px; text-align: center; }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 13px 26px;
            border: 1px solid var(--line);
            outline: 1px solid rgba(192, 138, 62, .14);
            outline-offset: 3px;
            background: linear-gradient(180deg, rgba(192, 138, 62, .18), rgba(192, 138, 62, .06));
            color: var(--brass-2);
            font-family: inherit;
            font-size: 14px;
            letter-spacing: .18em;
            text-indent: .18em;
            text-decoration: none;
            transition: border-color .25s ease, box-shadow .25s ease, transform .25s ease;
        }
        .back-btn:hover {
            border-color: var(--brass-2);
            box-shadow: 0 0 22px rgba(192, 138, 62, .28);
            transform: translateY(-2px);
        }
        .back-btn svg { width: 16px; }

        /* ---------- 页脚 ---------- */
        .foot {
            margin-top: 40px;
            text-align: center;
            font-size: 11px;
            letter-spacing: .18em;
            color: var(--ink-2);
            opacity: .5;
        }

        @media (max-width: 600px) {
            .wrap { padding: 40px 18px 48px; }
            .world-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .world-slot { min-height: 112px; padding: 18px 16px 16px; }
            .hero-title { letter-spacing: .1em; text-indent: .1em; }
            .hero-sub { letter-spacing: .2em; text-indent: .2em; }
        }
    </style>
</head>
<body>

    <!-- 齿轮 SVG 定义 -->
    <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
        <symbol id="gear" viewBox="0 0 200 200">
            <g fill="currentColor">
                <rect x="88" y="8" width="24" height="38" rx="4" transform="rotate(0 100 100)"/>
                <rect x="88" y="8" width="24" height="38" rx="4" transform="rotate(45 100 100)"/>
                <rect x="88" y="8" width="24" height="38" rx="4" transform="rotate(90 100 100)"/>
                <rect x="88" y="8" width="24" height="38" rx="4" transform="rotate(135 100 100)"/>
                <rect x="88" y="8" width="24" height="38" rx="4" transform="rotate(180 100 100)"/>
                <rect x="88" y="8" width="24" height="38" rx="4" transform="rotate(225 100 100)"/>
                <rect x="88" y="8" width="24" height="38" rx="4" transform="rotate(270 100 100)"/>
                <rect x="88" y="8" width="24" height="38" rx="4" transform="rotate(315 100 100)"/>
                <circle cx="100" cy="100" r="58"/>
            </g>
            <circle cx="100" cy="100" r="26" style="fill: var(--gear-hole)"/>
            <circle cx="100" cy="100" r="12" fill="currentColor"/>
        </symbol>
    </svg>

    <!-- 背景齿轮 -->
    <svg class="gear-fixed g1" viewBox="0 0 200 200" aria-hidden="true"><use href="#gear"/></svg>
    <svg class="gear-fixed g2" viewBox="0 0 200 200" aria-hidden="true"><use href="#gear"/></svg>

    <div class="wrap">
        <!-- 顶部装饰线 -->
        <div class="topbar"><span class="topbar-dot"></span></div>

        <!-- 首屏 -->
        <header class="hero">
            <span class="hero-label">World Archive</span>
            <h1 class="hero-title">世界观</h1>
            <p class="hero-sub">蒸汽中世纪 · 架空星球</p>
            <div class="hero-gears">
                <svg class="gear-s" viewBox="0 0 200 200" aria-hidden="true"><use href="#gear"/></svg>
                <svg class="gear-xs" viewBox="0 0 200 200" aria-hidden="true"><use href="#gear"/></svg>
            </div>
        </header>

        <!-- 分隔线 -->
        <div class="divider">
            <svg viewBox="0 0 200 200" aria-hidden="true"><use href="#gear"/></svg>
        </div>

        <!-- 设定主体（待填） -->
        <main class="stream">
            <div class="stream-head">
                <h2>设定施工中</h2>
                <span class="stream-note">内容待填</span>
            </div>

            <div class="world-grid">
                <div class="world-slot">
                    <div class="slot-head">
                        <span class="slot-no">I</span>
                        <div>
                            <div class="slot-title">地理</div>
                            <div class="slot-en">Geography</div>
                        </div>
                    </div>
                    <div class="slot-hint">待填</div>
                </div>
                <div class="world-slot">
                    <div class="slot-head">
                        <span class="slot-no">II</span>
                        <div>
                            <div class="slot-title">历史</div>
                            <div class="slot-en">History</div>
                        </div>
                    </div>
                    <div class="slot-hint">待填</div>
                </div>
                <div class="world-slot">
                    <div class="slot-head">
                        <span class="slot-no">III</span>
                        <div>
                            <div class="slot-title">国家</div>
                            <div class="slot-en">Nations</div>
                        </div>
                    </div>
                    <div class="slot-hint">待填</div>
                </div>
                <div class="world-slot">
                    <div class="slot-head">
                        <span class="slot-no">IV</span>
                        <div>
                            <div class="slot-title">技术</div>
                            <div class="slot-en">Technology</div>
                        </div>
                    </div>
                    <div class="slot-hint">待填</div>
                </div>
            </div>

            <!-- 返回 -->
            <div class="back-row">
                <a class="back-btn" href="../index.html" aria-label="返回主页">
                    <svg viewBox="0 0 200 200" aria-hidden="true"><use href="#gear"/></svg>
                    返回主页
                </a>
            </div>
        </main>

        <div class="foot">© 2050 · dede</div>
    </div>

</body>
</html>
